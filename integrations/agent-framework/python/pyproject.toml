[tool.poetry]
name = "ag-ui-agent-framework"
version = "0.1.0"
description = "Production-ready AG-UI protocol integration for the Microsoft Agent Framework"
authors = ["AG-UI Protocol Contributors <hello@ag-ui.com>"]
readme = "README.md"
packages = [
    { include = "ag_ui_agent_framework" }
]
exclude = [
    "ag_ui_agent_framework/examples/**",
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
ag-ui-protocol = { git = "https://github.com/mheindl-nh/ag-ui.git", branch = "main", subdirectory = "sdks/python" }
agent-framework = ">=1.0.0b251105"
fastapi = "^0.115.12"
uvicorn = ">=0.38.0"

[tool.poetry.dev-dependencies]
pytest = "^8.3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
